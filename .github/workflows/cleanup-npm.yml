name: Cleanup old npm package

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete @olishiz/connection-monitor from GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Attempting package delete..."
          HTTP=$(curl -sS -o /tmp/out -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/npm/connection-monitor")
          echo "HTTP ${HTTP}"
          cat /tmp/out
          echo
          if [ "${HTTP}" = "204" ] || [ "${HTTP}" = "404" ]; then
            echo "Done (deleted or already gone)."
            exit 0
          fi
          # Fallback: user-scoped path
          HTTP2=$(curl -sS -o /tmp/out2 -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/olishiz/packages/npm/connection-monitor")
          echo "users path HTTP ${HTTP2}"
          cat /tmp/out2
          echo
          if [ "${HTTP2}" = "204" ] || [ "${HTTP2}" = "404" ]; then
            echo "Done."
            exit 0
          fi
          echo "::warning::GITHUB_TOKEN cannot delete user packages. Delete in the UI:"
          echo "https://github.com/users/olishiz/packages/npm/connection-monitor/settings"
          exit 0
